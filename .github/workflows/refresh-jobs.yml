name: Refresh jobs

on:
  schedule:
    - cron: '7 */4 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Fetch every Adzuna category now (uses more Adzuna calls)'
        type: boolean
        default: false
  push:
    paths:
      - searches.json
      - docs/places.js
      - companies.json
      - companyInfo.json
      - scripts/**
      - server.js

permissions:
  contents: write

concurrency:
  group: refresh-jobs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch jobs
        run: node scripts/fetch.js
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
          FULL: ${{ inputs.full && '1' || '0' }}
      - name: Commit changes
        run: |
          git config user.name "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add docs/jobs.json
          git diff --cached --quiet || (git commit -m "Update jobs" && git pull --rebase -q && git push)
